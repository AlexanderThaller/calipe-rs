# calipers configuration. Translated from resources/telegraf.conf; inputs are
# added here as they get implemented.

[agent]
interval = "10s"
# hostname = ""          # default: gethostname()
# omit_hostname = false

[global_tags]
realm = "hetzner"
role = "root.thaller.ws"

[exporter]
listen = "0.0.0.0:9273"

[inputs.cpu]
percpu = true
totalcpu = true
# temperature = true   # needs coretemp(4)/amdtemp(4)
# frequency = true     # needs cpufreq(4)

[inputs.disk]
ignore_fs = ["tmpfs", "devtmpfs"]

[inputs.diskio]

[inputs.mem]

[inputs.swap]

[inputs.system]

[inputs.kernel]

[inputs.zfs]
# kstats = ["arcstats", "zfetchstats"]
# pools = true
# vdevs = true

[inputs.internal]
