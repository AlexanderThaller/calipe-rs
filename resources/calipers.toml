# calipers configuration. Translated from resources/telegraf.conf; inputs are
# added here as they get implemented.

[agent]
interval = "10s"
# hostname = ""          # default: gethostname()
# omit_hostname = false

[global_tags]
realm = "hetzner"
role = "root.thaller.ws"

[exporter]
listen = "0.0.0.0:9273"

[inputs.chrony]
# server = "127.0.0.1:323"

[inputs.cpu]
percpu = true
totalcpu = true
# temperature = true   # needs coretemp(4)/amdtemp(4)
# frequency = true     # needs cpufreq(4)

[inputs.disk]
ignore_fs = ["tmpfs", "devtmpfs"]

[inputs.diskio]

[inputs.mem]

[inputs.net]
# interfaces = ["igb0", "tailscale*"]   # default: all up, non-loopback

[inputs.netstat]

[inputs.processes]

[[inputs.procstat]]
exe = "uploader-rs"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "nginx"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "mimir"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "prometheus"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "telegraf"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "calipers"
tag_with = ["pid"]

[inputs.swap]

[inputs.system]

[inputs.kernel]

[inputs.zfs]
# kstats = ["arcstats", "zfetchstats"]
# pools = true
# vdevs = true

[[inputs.dns_query]]
domains = ["ip.thaller.ws"]
record_type = "A"
servers = ["1.0.0.1", "1.1.1.1", "8.8.4.4", "8.8.8.8"]

[[inputs.dns_query]]
domains = ["ip.thaller.ws"]
record_type = "AAAA"
servers = ["1.0.0.1", "1.1.1.1", "8.8.4.4", "8.8.8.8"]

[[inputs.http_response]]
urls = [
  "http://ip.thaller.ws/",
  "http://remoji.thaller.ws/",
  "https://ip.thaller.ws/",
  "https://remoji.thaller.ws/",
  "https://www.google.de/",
  "http://www.google.de/",
  "http://archlinux.thaller.ws/",
  "https://archlinux.thaller.ws/",
]

[inputs.internal]
