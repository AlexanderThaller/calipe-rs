# calipers configuration. Translated from resources/telegraf.conf; inputs are
# added here as they get implemented.

[agent]
interval = "10s"
# hostname = ""          # default: gethostname()
# omit_hostname = false

[global_tags]
realm = "hetzner"
role = "root.thaller.ws"

[exporter]
listen = "0.0.0.0:9273"

[inputs.cpu]
percpu = true
totalcpu = true
# temperature = true   # needs coretemp(4)/amdtemp(4)
# frequency = true     # needs cpufreq(4)

[inputs.disk]
ignore_fs = ["tmpfs", "devtmpfs"]

[inputs.diskio]

[inputs.mem]

[inputs.net]
# interfaces = ["igb0", "tailscale*"]   # default: all up, non-loopback

[inputs.netstat]

[inputs.processes]

[[inputs.procstat]]
exe = "http_responsetime_exporter"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "plexmediaserver"
tag_with = ["pid"]

[[inputs.procstat]]
pattern = "Plex"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "transmission-daemon"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "uploader-rs"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "mosquitto"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "sfz"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "nginx"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "mimir"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "prometheus"
tag_with = ["pid"]

[[inputs.procstat]]
exe = "logreader"
tag_with = ["pid"]

[inputs.swap]

[inputs.system]

[inputs.kernel]

[inputs.zfs]
# kstats = ["arcstats", "zfetchstats"]
# pools = true
# vdevs = true

[inputs.internal]
