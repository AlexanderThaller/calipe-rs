[global_tags]
  realm = 'hetzner'
  role = 'root.thaller.ws'
[agent]
  collection_jitter = '0s'
  debug = false
  flush_interval = '10s'
  flush_jitter = '0s'
  hostname = ''
  logfile = ''
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = false
  precision = ''
  quiet = false
  round_interval = true
[[outputs.prometheus_client]]
  listen = ':9273'
[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.disk]]
  ignore_fs = ['tmpfs', 'devtmpfs']
[[inputs.diskio]]
[[inputs.kernel]]
[[inputs.mem]]
[[inputs.net]]
[[inputs.netstat]]
[[inputs.processes]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.internal]]
[[inputs.chrony]]
[[inputs.zfs]]
  poolMetrics = true
[[inputs.smart]]
  excludes = ['/dev/ses0']
  nocheck = 'standby'
  path_smartctl = '/usr/local/sbin/smartctl'
  path_nvme = '/sbin/nvmecontrol'
[[inputs.pf]]
[[inputs.procstat]]
  exe = 'http_responsetime_exporter'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'plexmediaserver'
  tag_with = ['pid']
[[inputs.procstat]]
  pattern = 'Plex'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'transmission-daemon'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'http_responsetime_exporter'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'uploader-rs'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'mosquitto'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'sfz'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'nginx'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'mimir'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'prometheus'
  tag_with = ['pid']
[[inputs.procstat]]
  exe = 'logreader'
  tag_with = ['pid']
[[inputs.dns_query]]
  domains = ['ip.thaller.ws']
  record_type = 'A'
  servers = ['1.0.0.1', '1.1.1.1', '8.8.4.4', '8.8.8.8']
[[inputs.dns_query]]
  domains = ['ip.thaller.ws']
  record_type = 'AAAA'
  servers = ['1.0.0.1', '1.1.1.1', '8.8.4.4', '8.8.8.8']
[[inputs.http_response]]
  urls = ['http://ip.thaller.ws/',
  'http://remoji.thaller.ws/',
  'https://ip.thaller.ws/',
  'https://remoji.thaller.ws/',
  'https://www.google.de/',
  'http://www.google.de/',
  'http://archlinux.thaller.ws/',
  'https://archlinux.thaller.ws/']
[[inputs.exec]]
  commands = [
    "/root/src/priv/scripts/freebsd_cpu"
  ]
 data_format = "influx"
