[package]
name = "calipe-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime-serde = "1"
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
  "http-listener",
] }
metrics-util = { version = "0.20", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
  "rt",
  "macros",
  "time",
  "signal",
  "net",
  "process",
  "sync",
] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "ansi",
] }

[[bin]]
name = "calipers"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.deploy]
inherits = "release"
opt-level = 3
debug = false
strip = "none"
lto = true
codegen-units = 1
incremental = false
panic = "abort"
